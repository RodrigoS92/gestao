<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAFE Gestão">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>SAFE Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --ink:#1B1B1E; --muted:#64646A; --line:#E0E0DC;
  --chip:#EDEDEA; --red:#C8102E; --red-soft:#FBE7EA; --ok:#1E7F45; --ok-soft:#E3F3E9;
  --warn:#9A5B00; --warn-soft:#FBF0DC; --focus:#1F4FB5;
  --body:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --cond:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131315; --surface:#1C1C1F; --ink:#F1F1EE; --muted:#A3A3A9; --line:#2F2F34;
    --chip:#29292D; --red:#E3344A; --red-soft:#3A1A20; --ok:#43C27A; --ok-soft:#173222;
    --warn:#E6A640; --warn-soft:#3A2C14; --focus:#7FA3F5;
  }
}
:root[data-theme="dark"]{
  --bg:#131315; --surface:#1C1C1F; --ink:#F1F1EE; --muted:#A3A3A9; --line:#2F2F34;
  --chip:#29292D; --red:#E3344A; --red-soft:#3A1A20; --ok:#43C27A; --ok-soft:#173222;
  --warn:#E6A640; --warn-soft:#3A2C14; --focus:#7FA3F5;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Layout */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:.5px;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
.brand b{background:var(--red);color:#fff;padding:0 8px;border-radius:3px}
.brand span{color:var(--muted);font-weight:500;font-size:20px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{width:22px;height:22px;flex:none}
.nav .sm{display:none}
.nav a.on{color:var(--ink);background:var(--chip)}
.nav a.on svg{color:var(--red)}
.rail .papel{margin-top:auto;font-size:13px;color:var(--muted);padding:10px 12px}
main{padding:28px 32px 60px;max-width:1100px;width:100%;min-width:0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .rail .brand,.rail .papel{display:none}
  .nav{display:flex;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:10px;padding:6px 0;flex:1;text-align:center;min-width:0;letter-spacing:-.1px}
  .nav a.on{background:none}
  .nav .lg{display:none}
  .nav .sm{display:inline}
  main{padding:18px 16px 110px}
}

/* Type */
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
h1{font-size:40px}
h2{font-size:26px;margin-bottom:12px}
h3{font-size:20px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}

/* Controls */
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--chip);display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:42px}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=time],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:42px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.check input{width:18px;height:18px;accent-color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{flex:1;min-width:150px}

/* Panels & rows */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--chip)}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.avatar{text-decoration:none;width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:18px;flex:none;overflow:hidden;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:84px;height:84px;font-size:34px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.red{background:var(--red-soft);color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.belt{display:block;flex:none}

/* Home */
.hero{margin-bottom:22px}
.hero .dia{font-family:var(--cond);font-size:22px;color:var(--red);font-weight:600}
.hero h1{font-size:56px}
@media (max-width:560px){.hero h1{font-size:44px}}
.agenda{border-left:4px solid var(--red);margin-bottom:26px}
.aula{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.aula:last-child{border-bottom:0}
.aula .hora{font-family:var(--cond);font-size:30px;font-weight:700}
.aula .mod{font-weight:600;display:flex;align-items:center;gap:8px}
.aula:hover{background:var(--chip)}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.num{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.num strong{display:block;font-family:var(--cond);font-size:40px;line-height:1}
.num span{font-size:14px;color:var(--muted)}
@media (max-width:560px){.numeros{grid-template-columns:1fr 1fr 1fr;gap:8px}.num{padding:10px}.num strong{font-size:30px}.num span{font-size:12px}}

/* Chamada */
.chamada .row{padding:10px 14px}
.chamada .row.on{background:var(--ok-soft)}
.mark{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.row.on .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.sticky-count{position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big-count{font-family:var(--cond);font-size:34px;font-weight:700}

/* Ficha */
.ficha-top{display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.statline{display:flex;gap:26px;flex-wrap:wrap}
.statline div strong{display:block;font-family:var(--cond);font-size:30px}
.statline div span{font-size:13px;color:var(--muted)}

/* Ranking */
.pos{font-family:var(--cond);font-weight:700;font-size:24px;width:36px;text-align:center;flex:none}
.pos.p1{color:#B8860B}.pos.p2{color:#8A8D91}.pos.p3{color:#A0522D}
.bar{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--red)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
td input{min-height:36px;padding:6px 8px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:680px;padding:22px}
.modal h2{margin-bottom:16px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-family:var(--cond);font-weight:600;font-size:20px;margin-bottom:10px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;font-weight:500;max-width:90vw}
#conexao{position:fixed;left:0;right:0;top:0;z-index:70;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;font-size:14px;font-weight:600;text-align:center;display:none}
#conexao.con-off{background:var(--red);color:#fff}
#conexao.con-salvando{background:var(--warn-soft);color:var(--ink)}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Menu principal">
    <div class="brand"><b>SAFE</b><span>gestão</span></div>
    <div class="nav" id="nav"></div>
    <div class="papel" id="papel"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="modal-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {"apiKey": "AIzaSyCEd7QO5RsFsj0wO1o1aTjxRu6CaTKLc8E", "authDomain": "safe-gestao.firebaseapp.com", "databaseURL": "https://safe-gestao-default-rtdb.firebaseio.com", "projectId": "safe-gestao", "storageBucket": "safe-gestao.firebasestorage.app", "messagingSenderId": "541563339370", "appId": "1:541563339370:web:cb64a16abb6e9f09b30013"};
const ONLINE = !!FIREBASE_CONFIG;
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_C = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => fmtISO(new Date());
const parseD = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtBR = s => { const d = parseD(s); return d ? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}` : '—'; };
const addDias = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmtISO(d); };
const diasEntre = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
function mesesEntre(a, b){
  const x = parseD(a), y = parseD(b); if (!x || !y) return 0;
  let m = (y.getFullYear() - x.getFullYear()) * 12 + (y.getMonth() - x.getMonth());
  if (y.getDate() < x.getDate()) m--;
  return Math.max(0, m);
}
const idadeIBJJF = nasc => nasc ? new Date().getFullYear() - Number(nasc.slice(0,4)) : null;
function idadeReal(nasc){
  if (!nasc) return null; const n = parseD(nasc), h = new Date();
  let i = h.getFullYear() - n.getFullYear();
  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) i--;
  return i;
}
function tempoTexto(meses){
  const a = Math.floor(meses / 12), m = meses % 12;
  const pa = a ? `${a} ano${a > 1 ? 's' : ''}` : '';
  const pm = m ? `${m} ${m > 1 ? 'meses' : 'mês'}` : '';
  return [pa, pm].filter(Boolean).join(' e ') || 'menos de 1 mês';
}
const iniciais = nome => (nome || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
function waLink(tel, msg){
  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(msg || '')}`;
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ============ Faixas IBJJF ============ */
const SEQ_KIDS = ['branca','cinza-branca','cinza','cinza-preta','amarela-branca','amarela','amarela-preta','laranja-branca','laranja','laranja-preta','verde-branca','verde','verde-preta'];
const SEQ_ADULTO = ['branca','azul','roxa','marrom','preta','coral','vermelha-branca','vermelha'];
const COR = {branca:'#F1F1EE', cinza:'#8A8D91', amarela:'#EEC000', laranja:'#EE7A00', verde:'#2E8B3A', azul:'#1F4FB5', roxa:'#6A2C91', marrom:'#6B3E1E', preta:'#0A0A0A', vermelha:'#C8102E'};
function faixasPadrao(){
  const kids = [];
  [['cinza',4],['amarela',7],['laranja',10],['verde',13]].forEach(([c, idade]) => {
    const N = c[0].toUpperCase() + c.slice(1);
    kids.push({id:`${c}-branca`, nome:`${N} e branca`, base:COR[c], listra:COR.branca, grupo:'kids', idadeMin:idade, idadeMax:15, tempoMinMeses:0, maxGraus:4});
    kids.push({id:c, nome:N, base:COR[c], grupo:'kids', idadeMin:idade, idadeMax:15, tempoMinMeses:0, maxGraus:4});
    kids.push({id:`${c}-preta`, nome:`${N} e preta`, base:COR[c], listra:COR.preta, grupo:'kids', idadeMin:idade, idadeMax:15, tempoMinMeses:0, maxGraus:4});
  });
  return [
    {id:'branca', nome:'Branca', base:COR.branca, grupo:'todos', idadeMin:0, idadeMax:null, tempoMinMeses:0, maxGraus:4},
    ...kids,
    {id:'azul', nome:'Azul', base:COR.azul, grupo:'adulto', idadeMin:16, idadeMax:null, tempoMinMeses:24, maxGraus:4},
    {id:'roxa', nome:'Roxa', base:COR.roxa, grupo:'adulto', idadeMin:16, idadeMax:null, tempoMinMeses:18, maxGraus:4},
    {id:'marrom', nome:'Marrom', base:COR.marrom, grupo:'adulto', idadeMin:18, idadeMax:null, tempoMinMeses:12, maxGraus:4},
    {id:'preta', nome:'Preta', base:COR.preta, ponteira:COR.vermelha, grupo:'adulto', idadeMin:19, idadeMax:null, tempoMinMeses:372, maxGraus:6},
    {id:'coral', nome:'Coral (vermelha e preta)', blocos:[COR.vermelha, COR.preta], sem_ponteira:true, grupo:'adulto', idadeMin:50, idadeMax:null, tempoMinMeses:84, maxGraus:8},
    {id:'vermelha-branca', nome:'Vermelha e branca', blocos:[COR.vermelha, COR.branca], sem_ponteira:true, grupo:'adulto', idadeMin:57, idadeMax:null, tempoMinMeses:120, maxGraus:9},
    {id:'vermelha', nome:'Vermelha', base:COR.vermelha, sem_ponteira:true, grupo:'adulto', idadeMin:67, idadeMax:null, tempoMinMeses:0, maxGraus:10}
  ];
}
const faixa = id => S.config.faixas.find(f => f.id === id) || S.config.faixas[0];

function beltSVG(id, graus = 0, w = 120){
  const f = faixa(id), h = Math.round(w * 0.17), px = Math.round(w * 0.66), pw = Math.round(w * 0.24);
  let body = '';
  if (f.blocos){
    const n = 8, bw = w / n;
    for (let i = 0; i < n; i++) body += `<rect x="${i*bw}" y="0" width="${bw+0.5}" height="${h}" fill="${f.blocos[i % 2]}"/>`;
  } else {
    body = `<rect x="0" y="0" width="${w}" height="${h}" fill="${f.base}"/>`;
    if (f.listra) body += `<rect x="0" y="${h*0.36}" width="${w}" height="${h*0.28}" fill="${f.listra}"/>`;
  }
  let pont = '';
  if (!f.sem_ponteira){
    pont = `<rect x="${px}" y="0" width="${pw}" height="${h}" fill="${f.ponteira || '#0A0A0A'}"/>`;
    const g = Math.min(Number(graus) || 0, 10), sw = Math.max(2, w * 0.022), gap = sw * 1.9;
    for (let i = 0; i < g; i++) pont += `<rect x="${px + pw - (i+1)*gap}" y="0" width="${sw}" height="${h}" fill="#F7F7F7"/>`;
  }
  const label = `Faixa ${f.nome}${graus ? `, ${graus} grau${graus > 1 ? 's' : ''}` : ''}`;
  return `<svg class="belt" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>${body}${pont}<rect x=".5" y=".5" width="${w-1}" height="${h-1}" fill="none" stroke="rgba(128,128,128,.45)"/></svg>`;
}

function proximaFaixa(a){
  const idade = idadeIBJJF(a.nascimento); if (idade == null) return null;
  const cur = a.faixa || 'branca';
  if (idade < 16){
    const i = SEQ_KIDS.indexOf(cur);
    return i >= 0 && i < SEQ_KIDS.length - 1 ? SEQ_KIDS[i+1] : null;
  }
  if (SEQ_KIDS.includes(cur)) return 'azul';
  const i = SEQ_ADULTO.indexOf(cur);

function statusGraduacao(a){
  const idade = idadeIBJJF(a.nascimento);

  const cur = faixa(a.faixa || 'branca');
  if (cur.grupo === 'kids' && idade >= 16) return {tipo:'migrar', texto:`Faixa infantil não vale a partir dos 16 anos: migrar para azul`, next:'azul'};
  const nextId = proximaFaixa(a);
  if (!nextId) return {tipo:'max', texto:'Última faixa da sequência'};
  const nf = faixa(nextId);
  if (S.config.exigirGraus !== false && (a.graus || 0) < cur.maxGraus){

  }
  if (idade < nf.idadeMin){
    const ano = Number(a.nascimento.slice(0,4)) + nf.idadeMin;
    return {tipo:'idade', texto:`${nf.nome} a partir de ${ano} (idade mínima ${nf.idadeMin})`, next:nextId};
  }
  if (idade >= 18 && cur.tempoMinMeses > 0){
    const m = mesesEntre(a.dataFaixa || a.dataMatricula, hoje());
    if (m < cur.tempoMinMeses) return {tipo:'tempo', texto:`Faltam ${tempoTexto(cur.tempoMinMeses - m)} de tempo mínimo`, next:nextId};
  }
  return {tipo:'apto', texto:`Apto para ${nf.nome} pelos critérios IBJJF`, next:nextId};
}

  const plano = S.config.planos.find(p => p.id === a.plano);
  const hist = [...(a.historico || [])].sort((x, y) => y.data.localeCompare(x.data));
  const naFaixa = presEntre(id, a.dataFaixa || '0000', h);
  const kv = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  return `
  <p><a href="#/alunos" class="muted small">Voltar para alunos</a></p>
  <div class="ficha-top">
    <span class="avatar big" aria-hidden="true">${a.foto ? `<img src="${a.foto}" alt="">` : iniciais(a.nome)}</span>
    <div style="flex:1;min-width:220px">
      <h1 style="font-size:36px">${esc(a.nome)}</h1>
      ${usaFaixa(a) ? `<div class="meta" style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">${beltSVG(a.faixa, a.graus, 150)} <span class="muted">${esc(f.nome)}${a.graus ? `, ${a.graus} grau${a.graus > 1 ? 's' : ''}` : ''}</span></div>` : ''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${usaFaixa(a) ? `<button class="btn primary" data-act="graduar" data-id="${id}">Registrar graduação</button>` : ''}
      <button class="btn ghost" data-act="editar-aluno" data-id="${id}">Editar</button>
      ${tel ? `<a class="btn ghost" href="${waLink(tel, `Olá, ${a.nome.split(' ')[0]}!`)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
      ${S.config.facial ? `<button class="btn ghost" data-act="rosto" data-id="${id}">Rosto ${a.consBio ? `(${(a.rosto || []).length})` : '(sem autorização)'}</button>` : ''}
    </div>
  </div>
  <div class="panel">
    <div class="statline">
      <div><strong>${pres.length}</strong><span>treinos no total</span></div>
      <div><strong>${presEntre(id, addDias(h, -30), h)}</strong><span>nos últimos 30 dias</span></div>
      ${usaFaixa(a) ? `<div><strong>${naFaixa}</strong><span>desde a última faixa</span></div>` : ''}
      <div><strong>${ultimaPres(id) ? fmtBR(ultimaPres(id)).slice(0,5) : '—'}</strong><span>último treino</span></div>
    </div>
  </div>
  ${usaFaixa(a) ? `<div class="panel">
    <h3 style="margin-bottom:8px">Graduação</h3>
    <p style="margin:0 0 6px">${tagStatus(st)} <span class="muted small">${esc(st.texto)}</span></p>
    <p class="muted small" style="margin:0">Na faixa atual desde ${fmtBR(a.dataFaixa)} (${tempoTexto(mesesEntre(a.dataFaixa || a.dataMatricula, h))}). Idade IBJJF em ${new Date().getFullYear()}: ${idadeIBJJF(a.nascimento) ?? '—'} anos.</p>
    <h3 style="margin:18px 0 6px">Histórico</h3>
    ${hist.length ? `<ul class="timeline">${hist.map(x => `<li>${beltSVG(x.faixa, x.graus, 96)}<div class="grow" style="flex:1"><strong>${x.tipo === 'grau' ? `${x.graus}º grau` : `Faixa ${esc(faixa(x.faixa).nome)}`}</strong><div class="muted small">${fmtBR(x.data)}${x.prof ? `, por ${esc(x.prof)}` : ''}${x.obs ? `. ${esc(x.obs)}` : ''}</div></div><button class="btn small danger" data-act="del-hist" data-id="${id}" data-hid="${x.id}" aria-label="Apagar registro">Apagar</button></li>`).join('')}</ul>` : `<p class="muted small">Nenhuma graduação registrada ainda.</p>`}
  </div>` : ''}
  <div class="panel">
    <h3 style="margin-bottom:12px">Dados</h3>
    <dl class="kv">
      ${kv('Nascimento', a.nascimento ? `${fmtBR(a.nascimento)} (${idadeReal(a.nascimento)} anos)` : '')}
      ${kv('Sexo', esc(a.sexo))}
      ${kv('Modalidades', (a.mods || []).map(m => esc(mod(m)?.nome)).join(', '))}
      ${kv('Situação', esc(a.status === 'novo' ? 'Novo cadastro, aguardando revisão' : a.status) + ((a.historicoStatus || []).length ? ` desde ${fmtBR(a.historicoStatus.slice().sort((x, y) => x.data.localeCompare(y.data)).slice(-1)[0].data)}` : ''))}
      ${kv('Equipe de competição', a.atleta ? 'Sim' : '')}
      ${kv('Matrícula', fmtBR(a.dataMatricula))}
      ${kv('Telefone', esc(a.telefone))}
      ${kv('E-mail', esc(a.email))}
      ${kv('CPF', esc(a.cpf))}
      ${kv('Endereço', esc(a.endereco))}
      ${menor || a.responsavel ? kv('Responsável', esc([a.responsavel, a.telResp].filter(Boolean).join(', '))) : ''}
      ${kv('Emergência', esc(a.emergencia))}
      ${kv('Saúde', esc(a.saude))}
      ${kv('Peso', a.peso ? `${esc(a.peso)} kg` : '')}
      ${kv('Indicado por', esc(a.indicadoPor))}
      ${kv('Uso de imagem', a.consImagem ? 'Autorizado' : 'Não autorizado')}
      ${S.config.facial ? kv('Reconhecimento facial', a.consBio ? 'Autorizado' : 'Não autorizado') : ''}
      ${kv('Observações', esc(a.obs))}
      ${isAdmin() ? kv('Plano', plano ? `${esc(plano.nome)}, R$ ${plano.valor}/mês` : 'Não definido') + kv('Vencimento', a.vencimento ? `Dia ${a.vencimento}` : '') + kv('Bolsa', a.bolsa && a.bolsa !== 'nenhuma' ? (a.bolsa === 'professor' ? 'Isento (professor ou instrutor)' : a.bolsa === 'integral' ? 'Integral' : `Parcial, ${a.bolsaPct || 0}%`) : '') + kv('Desconto', a.desconto ? `R$ ${a.desconto} (${esc(a.descontoMotivo || 'sem motivo')})` : '') : ''}
    </dl>
  </div>
  ${isAdmin() ? `<button class="btn danger" data-act="excluir-aluno" data-id="${id}">Excluir aluno</button>` : ''}`;
}

function formAluno(id, pre, aoSalvar){
  const a = id ? S.alunos[id] : {status:'ativo', dataMatricula:hoje(), faixa:'branca', graus:0, dataFaixa:hoje(), mods:[], bolsa:'nenhuma', ...(pre || {})};

        <div class="field"><label for="peso">Peso (kg)</label><input type="number" step="0.1" id="peso" name="peso" value="${esc(a.peso)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" inputmode="numeric" value="${esc(a.cpf)}"></div>
        <div class="field"><label for="status">Situação</label><select id="status" name="status" data-original="${esc(a.status)}">${opt('novo','Novo cadastro (revisar)',a.status === 'novo')}${opt('ativo','Ativo',a.status === 'ativo')}${opt('trancado','Trancado',a.status === 'trancado')}${opt('inativo','Inativo',a.status === 'inativo')}</select></div>
      </div>
      <div id="boxDataStatus" style="display:none"><div class="grid2">
        <div class="field"><label for="dataStatus">Mudança de situação vale a partir de</label><input type="date" id="dataStatus" name="dataStatus" value="${hoje()}"></div>
        <div class="field" id="boxMotivo"><label for="motivo">Motivo da saída *</label><select id="motivo" name="motivo"><option value="">Selecione</option>${MOTIVOS.map(m => `<option>${m}</option>`).join('')}</select></div></div>
        <div class="field" id="boxMotivoObs"><label for="motivoObs">Detalhe do motivo (opcional)</label><input type="text" id="motivoObs" name="motivoObs" placeholder="Ex.: mudou de turno no trabalho"></div></div>
    </fieldset>
    <fieldset><legend>Contato</legend>
      <div class="grid2">
        <div class="field"><label for="tel">Telefone (WhatsApp)</label><input type="tel" id="tel" name="telefone" placeholder="21 99999-9999" value="${esc(a.telefone)}"></div>
        <div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" value="${esc(a.email)}"></div>
      </div>
      <div class="field"><label for="end">Endereço</label><input type="text" id="end" name="endereco" value="${esc(a.endereco)}"></div>
      <div class="grid2">
        <div class="field"><label for="resp">Responsável (menores)</label><input type="text" id="resp" name="responsavel" value="${esc(a.responsavel)}"></div>
        <div class="field"><label for="telResp">Telefone do responsável</label><input type="tel" id="telResp" name="telResp" value="${esc(a.telResp)}"></div>
      </div>
      <div class="field"><label for="emerg">Contato de emergência</label><input type="text" id="emerg" name="emergencia" placeholder="Nome e telefone" value="${esc(a.emergencia)}"></div>
      <div class="field"><label for="saude">Saúde e restrições</label><textarea id="saude" name="saude" placeholder="Lesões, alergias, medicamentos, cirurgias">${esc(a.saude)}</textarea></div>
    </fieldset>
    <fieldset><legend>Treino</legend>
      <div class="field"><label>Modalidades</label><div class="checks">${S.config.modalidades.map(m => `<label class="check"><input type="checkbox" name="mods" value="${m.id}" ${(a.mods || []).includes(m.id) ? 'checked' : ''}><i class="dot" style="background:${m.cor}"></i>${esc(m.nome)}</label>`).join('')}</div></div>
      <div class="grid2">
        <div class="field"><label for="dm">Data de matrícula</label><input type="date" id="dm" name="dataMatricula" value="${esc(a.dataMatricula)}"></div>
        <div class="field"><label for="ind">Indicado por</label><input type="text" id="ind" name="indicadoPor" list="dlAlunos" value="${esc(a.indicadoPor)}"><datalist id="dlAlunos">${Object.values(S.alunos).map(x => `<option value="${esc(x.nome)}">`).join('')}</datalist></div>
      </div>
      <div class="field" style="max-width:320px"><label for="canal">Como conheceu a SAFE</label><select id="canal" name="canal">${opt('', 'Selecione')}${CANAIS.map(c => opt(c, c, a.canal === c)).join('')}</select></div>
      ${id ? '' : `<div class="grid3">
        <div class="field"><label for="fx">Faixa atual</label><select id="fx" name="faixa">${S.config.faixas.map(f => opt(f.id, esc(f.nome), a.faixa === f.id)).join('')}</select></div>
        <div class="field"><label for="gr">Graus</label><input type="number" min="0" max="10" id="gr" name="graus" value="${a.graus || 0}"></div>
        <div class="field"><label for="df">Desde</label><input type="date" id="df" name="dataFaixa" value="${esc(a.dataFaixa)}"></div>
      </div><p class="muted small" style="margin-top:-4px">Depois do cadastro, as mudanças de faixa e grau são feitas em "Registrar graduação", para manter o histórico.</p>`}
    </fieldset>
    <label class="check" style="margin:-6px 0 18px"><input type="checkbox" name="atleta" ${a.atleta ? 'checked' : ''}>Atleta da equipe de competição</label>
    ${isAdmin() ? `<fieldset><legend>Plano e valores</legend>
      <div class="grid2">
        <div class="field"><label for="plano">Plano</label><select id="plano" name="plano">${opt('', 'Sem plano definido')}${S.config.planos.map(p => opt(p.id, `${esc(p.nome)}, R$ ${p.valor}`, a.plano === p.id)).join('')}</select></div>
        <div class="field"><label for="venc">Dia de vencimento</label><input type="number" min="1" max="31" id="venc" name="vencimento" value="${esc(a.vencimento || 10)}"></div>
      </div>
      <div class="grid3">
        <div class="field"><label for="bolsa">Bolsa</label><select id="bolsa" name="bolsa">${opt('nenhuma','Nenhuma',a.bolsa === 'nenhuma')}${opt('parcial','Parcial',a.bolsa === 'parcial')}${opt('integral','Integral',a.bolsa === 'integral')}${opt('professor','Isento: professor ou instrutor',a.bolsa === 'professor')}</select></div>
        <div class="field"><label for="bpct">% da bolsa parcial</label><input type="number" min="0" max="100" id="bpct" name="bolsaPct" value="${esc(a.bolsaPct)}"></div>
        <div class="field"><label for="desc">Desconto (R$/mês)</label><input type="number" min="0" id="desc" name="desconto" value="${esc(a.desconto)}"></div>
      </div>
      <div class="field"><label for="dmot">Motivo do desconto</label><select id="dmot" name="descontoMotivo">${['','Indicação','Irmãos/família','Atleta da equipe','Outro'].map(v => opt(v, v || 'Selecione', a.descontoMotivo === v)).join('')}</select></div>
    </fieldset>` : ''}
    <fieldset><legend>Autorizações (LGPD)</legend>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" name="consImagem" ${a.consImagem ? 'checked' : ''}>Autoriza uso de imagem em fotos e redes sociais</label>
      ${S.config.facial ? `<label class="check"><input type="checkbox" name="consBio" ${a.consBio ? 'checked' : ''}>Autoriza reconhecimento facial para presença</label>` : ''}
    </fieldset>
    <div class="field"><label for="obs">Observações</label><textarea id="obs" name="obs">${esc(a.obs)}</textarea></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" type="submit">${id ? 'Salvar alterações' : 'Cadastrar aluno'}</button></div>
  </form>`);
  $('#inFoto').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.src = rd.result; };
    img.onload = () => {
      const s = 240, c = document.createElement('canvas'); c.width = c.height = s;
      const r = Math.min(img.width, img.height), ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width - r) / 2, (img.height - r) / 2, r, r, 0, 0, s, s);
      const data = c.toDataURL('image/jpeg', 0.8);
      document.querySelector('[name=foto]').value = data;
      $('#prevFoto').innerHTML = `<img src="${data}" alt="">`;
    };
    rd.readAsDataURL(file);
  });
  const orig = id && S.alunos[id] ? JSON.parse(JSON.stringify(S.alunos[id])) : null;
  const selSt = $('#status'), boxSt = $('#boxDataStatus');
  selSt.addEventListener('change', () => {
    const mudou = id && selSt.value !== selSt.dataset.original, saida = ['inativo','trancado'].includes(selSt.value);
    boxSt.style.display = mudou ? '' : 'none'; $('#boxMotivo').style.display = saida ? '' : 'none'; $('#boxMotivoObs').style.display = saida ? '' : 'none';
  });
  let enviando = false;
  $('#fAluno').addEventListener('submit', async e => {
    e.preventDefault(); if (enviando) return;
    const fd = new FormData(e.target), o = {};
    for (const [k, v] of fd.entries()) if (k !== 'mods') o[k] = typeof v === 'string' ? v.trim() : v;
    o.mods = fd.getAll('mods');
    o.consImagem = fd.has('consImagem'); o.consBio = S.config.facial ? fd.has('consBio') : !!(id && S.alunos[id] && S.alunos[id].consBio); o.atleta = fd.has('atleta');
    const dataStatus = o.dataStatus || hoje(), motivo = o.motivo || '', motivoObs = o.motivoObs || ''; delete o.dataStatus; delete o.motivo; delete o.motivoObs;
    if (id && orig && o.status !== orig.status && ['inativo','trancado'].includes(o.status) && !motivo) return toast('Informe o motivo da saída. Ele alimenta o painel de retenção.');
    o.nome = (o.nome || '').replace(/\s+/g, ' ');
    if (!o.nome) return toast('Informe o nome do aluno.');
    if (!o.nascimento || o.nascimento > hoje()) return toast('Informe uma data de nascimento válida.');
    if (!o.sexo) return toast('Informe o sexo (usado nas categorias de competição).');
    const menor = idadeReal(o.nascimento) < 18;
    if (menor && (!o.responsavel || !o.telResp)) return toast('Aluno menor de idade: informe o responsável e o telefone dele.');
    const dig = t => String(t || '').replace(/\D/g, '');
    if (o.telefone && ![10, 11, 12, 13].includes(dig(o.telefone).length)) return toast('Telefone do aluno parece incompleto. Use DDD + número.');
    if (o.telResp && ![10, 11, 12, 13].includes(dig(o.telResp).length)) return toast('Telefone do responsável parece incompleto. Use DDD + número.');
    if (o.cpf && !cpfValido(o.cpf)) return toast('CPF inválido. Confira os números ou deixe em branco.');
    if (!o.mods.length && o.status === 'ativo') return toast('Marque ao menos uma modalidade para aluno ativo.');
    const dup = Object.values(S.alunos).find(x => x.id !== id && norm(x.nome) === norm(o.nome));
    enviando = true;
    try {
      if (dup && !(await confirmar(`Já existe um aluno chamado ${dup.nome}${dup.nascimento ? `, nascido em ${fmtBR(dup.nascimento)}` : ''}. Salvar mesmo assim?`, 'Salvar mesmo assim'))){ enviando = false; return formAluno(id); }
      if (isAdmin() && o.status === 'ativo' && !o.plano && o.bolsa !== 'professor' && !(await confirmar('Aluno ativo sem plano não entra na cobrança de mensalidades. Salvar mesmo assim?', 'Salvar sem plano'))){ enviando = false; return; }
    } catch(err){ enviando = false; return; }
    if (id){
      const a = S.alunos[id];
      if (!a){ enviando = false; return toast('Este aluno foi excluído por outro usuário.'); }
      const antigo = orig.status;
      // só grava o que foi realmente alterado neste formulário, para não sobrescrever mudanças feitas em outro aparelho
      Object.entries(o).forEach(([k, v]) => {
        const antes = orig[k];
        const igual = Array.isArray(v) ? JSON.stringify(antes || []) === JSON.stringify(v) : String(antes ?? '') === String(v ?? '');
        if (!igual) a[k] = v;
      });
      if (!o.consBio) delete a.rosto;
      if (antigo !== o.status){
        const ent = {data:dataStatus, status:o.status, anterior:antigo, por:quem()};
        if (['inativo','trancado'].includes(o.status)){ ent.motivo = motivo; if (motivoObs) ent.motivoObs = motivoObs; }
        a.historicoStatus = [...(a.historicoStatus || []), ent];
        registrar(`Situação de ${a.nome}: ${antigo} para ${o.status} (a partir de ${fmtBR(dataStatus)})${motivo && ent.motivo ? `, motivo: ${motivo}` : ''}`);
      } else registrar(`Editou a ficha de ${a.nome}`);
    } else {
      const nid = uid(); o.graus = Number(o.graus) || 0;
      S.alunos[nid] = {...o, id:nid, historicoStatus:[], historico:[{id:uid(), tipo:'faixa', faixa:o.faixa, graus:o.graus, data:o.dataFaixa || hoje(), obs:'Faixa no cadastro'}]};
      registrar(`Cadastrou o aluno ${o.nome}`);
      if (aoSalvar) aoSalvar(nid);
      location.hash = `#/aluno/${nid}`;
    }
    salvar(); fecharModal(); render(); toast(id ? 'Alterações salvas' : 'Aluno cadastrado');
  });
}

function formGraduacao(id){
  const a = S.alunos[id], st = statusGraduacao(a);
  const maxG = faixa(a.faixa).maxGraus;
  abrirModal(`
  <form id="fGrad">
    <h2>Registrar graduação</h2>
    <p style="display:flex;gap:10px;align-items:center">${beltSVG(a.faixa, a.graus, 120)} <span><strong>${esc(a.nome)}</strong><br><span class="muted small">${esc(st.texto)}</span></span></p>
    ${st.tipo !== 'apto' && st.tipo !== 'migrar' ? `<div class="notice">Pelos critérios IBJJF cadastrados, o aluno ainda não cumpre os requisitos para a próxima faixa. Você pode registrar mesmo assim (graus, por exemplo, não têm tempo mínimo).</div>` : ''}
    <div class="field"><label>Tipo</label><div class="checks">
      <label class="check"><input type="radio" name="tipo" value="grau" ${a.graus < maxG ? 'checked' : ''}>Novo grau</label>
      <label class="check"><input type="radio" name="tipo" value="faixa" ${a.graus >= maxG ? 'checked' : ''}>Nova faixa</label>
    </div></div>
    <div class="grid2">
      <div class="field" id="boxFaixa"><label for="gf">Nova faixa</label><select id="gf" name="faixa">${S.config.faixas.map(f => `<option value="${f.id}" ${f.id === (st.next || a.faixa) ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></div>
      <div class="field"><label for="gg">Graus após a graduação</label><input type="number" min="0" max="10" id="gg" name="graus" value="${Math.min((a.graus || 0) + 1, maxG)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="gd">Data</label><input type="date" id="gd" name="data" value="${hoje()}" required></div>
      <div class="field"><label for="gp">Professor</label><input type="text" id="gp" name="prof" value="${esc(S.meta.ultimoProf || '')}"></div>
    </div>
    <div class="field"><label for="go">Observação</label><input type="text" id="go" name="obs" placeholder="Ex.: graduação de fim de ano"></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" type="submit">Registrar</button></div>
  </form>`);
  const sync = () => {
    const tipo = document.querySelector('[name=tipo]:checked').value;
    $('#boxFaixa').style.display = tipo === 'faixa' ? '' : 'none';
    $('#gg').value = tipo === 'faixa' ? 0 : Math.min((a.graus || 0) + 1, maxG);
  };
  document.querySelectorAll('[name=tipo]').forEach(r => r.addEventListener('change', sync)); sync();
  $('#fGrad').addEventListener('submit', e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const a = S.alunos[id]; if (!a) return toast('Aluno não encontrado.');
    const reg = {id:uid(), tipo:fd.tipo, data:fd.data, prof:fd.prof, obs:fd.obs, graus:Number(fd.graus) || 0, faixa: fd.tipo === 'faixa' ? fd.faixa : a.faixa};
    a.historico ||= []; a.historico.push(reg);
    a.faixa = reg.faixa; a.graus = reg.graus;
    if (fd.tipo === 'faixa') a.dataFaixa = reg.data;
    a.dataGrau = reg.data; S.meta.ultimoProf = fd.prof;
    registrar(`Graduação de ${a.nome}: ${reg.tipo === 'grau' ? `${reg.graus}º grau` : `faixa ${faixa(reg.faixa).nome}`} em ${fmtBR(reg.data)}`);
    salvar(); fecharModal(); render(); toast('Graduação registrada');
  });
}

  if (ui.presTab === 'chamada'){

    const aulas = S.config.turmas.filter(t => t.dia === dow).sort((a, b) => a.hora.localeCompare(b.hora));
    corpo = `<div class="filters"><div class="field" style="max-width:240px"><label for="presData">Data da aula</label><input type="date" id="presData" value="${ui.presData}"></div></div>
    <h2>${DIAS[dow]}, ${fmtBR(ui.presData)}</h2>
    <div class="list agenda">${aulas.length ? aulas.map(t => {
      const m = mod(t.mod) || {nome:'?', cor:'#999'}; const p = S.presencas[`${ui.presData}_${t.id}`];
      const n = p ? Object.keys(p.alunos || {}).length : 0;
      return `<a class="aula" href="#/chamada/${ui.presData}/${t.id}"><span class="hora">${t.hora}</span><span class="mod"><i class="dot" style="background:${m.cor}"></i><span>${esc(m.nome)}${p && p.prof ? `<br><span class="muted small" style="font-weight:400">${esc(p.prof)}</span>` : ''}</span></span><span class="${n ? 'tag ok' : 'btn small primary'}">${n ? `${n} presente${n > 1 ? 's' : ''}` : 'Fazer chamada'}</span></a>`;
    }).join('') : `<div class="empty">Não há aulas na grade de ${DIAS[dow].toLowerCase()}. Ajuste a grade em Ajustes.</div>`}</div>`;
  } else if (ui.presTab === 'professores'){
    corpo = viewProfessores();
  } else if (ui.presTab === 'ranking'){
    corpo = viewRanking();
  } else {
    corpo = viewSumidos();
  }
  return `<div class="head"><h1>Presença</h1></div>
  <div class="tabs" role="tablist">${tabs.map(([id, t]) => `<button role="tab" aria-selected="${ui.presTab === id}" class="${ui.presTab === id ? 'on' : ''}" data-act="presTab" data-v="${id}">${t}</button>`).join('')}</div>${corpo}`;

function periodo(p){
  const h = new Date(), y = h.getFullYear(), m = h.getMonth();
  if (p === 'mes') return [fmtISO(new Date(y, m, 1)), hoje(), `${MESES[m]} de ${y}`];
  if (p === 'mesAnt') return [fmtISO(new Date(y, m-1, 1)), fmtISO(new Date(y, m, 0)), `${MESES[(m+11) % 12]}`];
  if (p === 'tri') { const q = Math.floor(m / 3) * 3; return [fmtISO(new Date(y, q, 1)), hoje(), `${Math.floor(m/3)+1}º trimestre de ${y}`]; }
  return [`${y}-01-01`, hoje(), `${y}`];
}
function viewRanking(){
  const [ini, fim, nome] = periodo(ui.rankPer);
  const turmasMod = new Set(S.config.turmas.filter(t => !ui.rankMod || t.mod === ui.rankMod).map(t => t.id));
  const cont = {};
  Object.values(S.presencas).forEach(p => {
    if (p.data < ini || p.data > fim || !turmasMod.has(p.turma)) return;
    Object.keys(p.alunos || {}).forEach(id => { cont[id] = (cont[id] || 0) + 1; });
  });
  const arr = Object.entries(cont).filter(([id]) => S.alunos[id]).sort((a, b) => b[1] - a[1]);
  const max = arr.length ? arr[0][1] : 1;
  let pos = 0, ult = null;
  return `<div class="filters">
    <select id="rankPer" aria-label="Período">${[['mes','Este mês'],['mesAnt','Mês passado'],['tri','Este trimestre'],['ano','Este ano']].map(([v, t]) => `<option value="${v}" ${ui.rankPer === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <select id="rankMod" aria-label="Modalidade"><option value="">Todas as modalidades</option>${S.config.modalidades.map(m => `<option value="${m.id}" ${ui.rankMod === m.id ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}</select>
  </div>
  <p class="muted small">Treinos registrados em ${nome}. Empates dividem a posição.</p>
  <div class="list">${arr.length ? arr.map(([id, n], i) => {
    if (n !== ult){ pos = i + 1; ult = n; }
    const a = S.alunos[id];
    return `<a class="row" href="#/aluno/${id}"><span class="pos ${pos <= 3 ? 'p' + pos : ''}">${pos}º</span><span class="avatar" aria-hidden="true">${a.foto ? `<img src="${a.foto}" alt="">` : iniciais(a.nome)}</span><span class="grow"><span class="name" style="display:block">${esc(a.nome)}</span><span class="bar"><i style="width:${Math.round(n / max * 100)}%"></i></span></span><strong style="font-family:var(--cond);font-size:24px">${n}</strong></a>`;
  }).join('') : `<div class="empty">Nenhuma presença registrada nesse período.</div>`}</div>`;
}
function viewSumidos(){
  const grupos = [[21, Infinity, 'Há 21 dias ou mais'], [14, 20, 'Entre 14 e 20 dias'], [7, 13, 'Entre 7 e 13 dias']];
  const ativos = alunosAtivos().map(a => ({a, d:diasSumido(a)})).filter(x => x.d != null && x.d >= 7);
  return `<p class="muted small">Alunos ativos sem presença registrada. Quem começa a faltar costuma ser quem cancela depois: um contato cedo faz diferença.</p>` +
  grupos.map(([mn, mx, tit]) => {
    const g = ativos.filter(x => x.d >= mn && x.d <= mx).sort((x, y) => y.d - x.d);
    return `<h2 style="margin-top:18px">${tit} <span class="muted" style="font-size:18px">(${g.length})</span></h2><div class="list">${g.length ? g.map(({a, d}) => {
      const link = waLink(a.telefone || a.telResp, `Oi, ${a.nome.split(' ')[0]}! Sentimos sua falta no tatame. Está tudo bem? Te esperamos no próximo treino. Oss!`);
      return `<div class="row"><a href="#/aluno/${a.id}" class="avatar" aria-hidden="true">${a.foto ? `<img src="${a.foto}" alt="">` : iniciais(a.nome)}</a><a class="grow" href="#/aluno/${a.id}" style="text-decoration:none"><span class="name" style="display:block">${esc(a.nome)}</span><span class="meta">${d} dias, último treino ${ultimaPres(a.id) ? fmtBR(ultimaPres(a.id)) : 'nunca registrado'}</span></a>${link ? `<a class="btn small ghost" href="${link}" target="_blank" rel="noopener">Chamar</a>` : ''}</div>`;
    }).join('') : `<div class="empty">Ninguém neste grupo.</div>`}</div>`;
  }).join('');
}

function listaChamada(data, tid){
  const t = turma(tid); if (!t) return;
  const key = `${data}_${tid}`, p = S.presencas[key] || {alunos:{}};
  const q = ui.chamadaBusca.trim().toLowerCase();
  const ids = new Set(alunosAtivos().filter(a => (a.mods || []).includes(t.mod)).map(a => a.id));
  Object.keys(p.alunos).forEach(id => { if (S.alunos[id]) ids.add(id); });
  const arr = [...ids].map(id => S.alunos[id]).filter(a => !q || a.nome.toLowerCase().includes(q)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  $('#nPres').textContent = Object.keys(p.alunos).length;
  $('#listaChamada').innerHTML = arr.length ? arr.map(a => {
    const on = !!p.alunos[a.id];
    return `<button class="row ${on ? 'on' : ''}" data-act="toggle-pres" data-id="${a.id}" data-key="${key}" data-data="${data}" data-t="${tid}" aria-pressed="${on}">
      <span class="mark" aria-hidden="true">${on ? '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</span>
      <span class="avatar" aria-hidden="true">${a.foto ? `<img src="${a.foto}" alt="">` : iniciais(a.nome)}</span>
      <span class="grow"><span class="name" style="display:block">${esc(a.nome)}</span>${(a.mods || []).includes(t.mod) ? '' : '<span class="meta">de outra turma</span>'}</span>
      ${beltSVG(a.faixa, a.graus, 70)}</button>`;
  }).join('') : `<div class="empty">Nenhum aluno ativo em ${esc(mod(t.mod)?.nome)}. Marque a modalidade na ficha do aluno.</div>`;
}
function togglePres(id, key, data, tid){
  const p = S.presencas[key] ||= {data, turma:tid, alunos:{}};
  if (!p.prof){ const v = ($('#profAula') || {}).value || profPadrao(); if (v) p.prof = v; }
  if (p.alunos[id]) delete p.alunos[id]; else p.alunos[id] = true;
  if (!Object.keys(p.alunos).length) delete S.presencas[key];
  salvar(); listaChamada(data, tid);
}

function tabelaPesos(idade, sexo, formato){
  if (idade <= 15){
    const lim = comp().kids[idade]; if (!lim) return null;
    return lim.map((v, i) => ({nome:CAT9[i], max:v})).filter((c, i) => c.max != null || i === 0);
  }

function categoriaDe({nascimento, sexo, peso, formato = 'gi'}){
  const idade = nascimento ? idadeIBJJF(nascimento) : null;
  const sx = sexo === 'Feminino' ? 'F' : sexo === 'Masculino' ? 'M' : null;
  if (idade == null || !sx || !peso) return {erro:'Informe sexo, nascimento e peso'};
  if (idade < 4) return {erro:'Abaixo da idade mínima de competição (4 anos)'};
  const div = divisaoIdade(idade);
  if (idade <= 15 && formato === 'nogi') return {div:div?.nome, erro:'Tabela kids NoGi não cadastrada. Consulte o edital do evento.'};
  const bal = formato === 'gi' ? Number(peso) + Number(comp().kimonoKg || 0) : Number(peso);
  const tab = tabelaPesos(idade, sx, formato);
  if (!tab) return {div:div?.nome, erro:'Tabela de pesos não encontrada'};
  const i = tab.findIndex(c => c.max == null || bal <= c.max);
  if (i < 0){
    const ult = tab[tab.length-1];
    return {div:div?.nome, bal, erro:`Acima de ${ult.nome} (${ult.max} kg). ${idade <= 15 ? 'Complete as categorias mais pesadas da tabela kids com o PDF oficial.' : ''}`};
  }
  const c = tab[i];
  return {div:div?.nome, idade, bal, cat:c.nome, max:c.max, margem:c.max != null ? +(c.max - bal).toFixed(1) : null, abaixo:i > 0 ? tab[i-1] : null};
}
function colGolpes(idade, faixaId, formato, divisao){
  if (idade <= 12) return 0;
  if (idade <= 15) return 1;
  if (idade <= 17 || faixaId === 'branca') return 2;
  if (faixaId === 'azul' || faixaId === 'roxa') return 3;
  return formato === 'nogi' && divisao === 'adulto' ? 5 : 4;
}

function parseTabela(txt){
  const d = txt.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cel = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"' && txt[i+1] === '"'){ cel += '"'; i++; } else if (ch === '"') q = false; else cel += ch; }
    else if (ch === '"' && cel === '') q = true;
    else if (ch === d){ row.push(cel); cel = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i+1] === '\n') i++; row.push(cel); rows.push(row); row = []; cel = ''; }
    else cel += ch;
  }
  if (cel !== '' || row.length){ row.push(cel); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
function dataForm(s){
  s = String(s || '').trim().split(' ')[0]; let m;
  if ((m = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return '';
}
function faixaForm(s){
  const n = norm(s);
  const mapa = [['cinza','cinza'],['amarel','amarela'],['laranj','laranja'],['verde','verde'],['azul','azul'],['rox','roxa'],['marrom','marrom'],['pret','preta']];
  const f = mapa.find(([k]) => n.includes(k));
  return f ? f[1] : 'branca';
}
function importarForms(txt){
  const rows = parseTabela(txt);
  if (rows.length < 2) return {erro:'Não encontrei linhas. Copie a planilha inteira, incluindo a linha de títulos.'};
  const H = rows[0].map(norm);
  const achar = (fn, depois = -1) => H.findIndex((h, i) => i > depois && fn(h));
  const cNome = achar(h => h.includes('nome completo do aluno') || h === 'nome' || h.includes('nome do aluno'));
  const cNasc = achar(h => h.includes('nascimento'));
  const cTel = achar(h => h.startsWith('telefone'));
  const cTipo = achar(h => h.includes('o aluno e'));
  const cResp = achar(h => h.startsWith('nome completo') && !h.includes('aluno'));
  const cPar = achar(h => h.includes('parentesco'));
  const cTelResp = cTel >= 0 ? achar(h => h.startsWith('telefone'), cTel) : -1;
  const cLes = achar(h => h.includes('lesao') || h.includes('limitacao'));
  const cMed = achar(h => h.includes('condicao medica'));
  const cArte = achar(h => h.includes('arte marcial'));
  const cFaixa = achar(h => h.includes('faixa'));
  const cData = achar(h => h.includes('carimbo') || h.includes('timestamp'));
  const cSexo = achar(h => h === 'sexo' || h.startsWith('sexo'));
  const cMod = achar(h => h.includes('modalidade'));
  const cEmail = achar(h => h.includes('e-mail') || h === 'email');
  const cEmerg = achar(h => h.includes('emergencia'));
  const cComo = achar(h => h.includes('como conheceu'));
  const cInd = achar(h => h.includes('quem indicou'));
  const cImg = achar(h => h.includes('uso de imagem'));
  const cBio = achar(h => h.includes('reconhecimento facial'));
  if (cNome < 0) return {erro:'Não encontrei a coluna com o nome do aluno. Confira se copiou a linha de títulos.'};
  const vazio = v => ['', 'nao', 'não', 'n/a', '-', 'nenhum', 'nenhuma'].includes(norm(v));
  const existentes = new Set(Object.values(S.alunos).map(a => norm(a.nome) + '|' + (a.nascimento || '')));
  let novos = 0, dup = 0;
  rows.slice(1).forEach(r => {
    const g = c => c >= 0 ? String(r[c] || '').trim() : '';
    const nome = g(cNome).replace(/\s+/g, ' '); if (!nome) return;
    const nomeFmt = nome === nome.toUpperCase() ? nome.toLowerCase().replace(/(^|\s)(\S)/g, (m, s, l) => s + l.toUpperCase()) : nome;
    const nasc = dataForm(g(cNasc));
    if (existentes.has(norm(nomeFmt) + '|' + nasc)){ dup++; return; }
    const crianca = norm(g(cTipo)).includes('crianca') || (nasc && idadeReal(nasc) < 18);
    const saude = [g(cLes), g(cMed)].filter(v => !vazio(v)).join('. ');
    const fx = faixaForm(g(cFaixa)), dm = dataForm(g(cData)) || hoje();
    const mt = norm(g(cMod)), mods = [];
    if (mt.includes('kids')) mods.push('kids');
    if (mt.includes('adulto')) mods.push('jj');
    if (mt.includes('nogi') || mt.includes('no-gi') || mt.includes('no gi')) mods.push('nogi');
    if (mt.includes('muay')) mods.push('mt');
    const sx = norm(g(cSexo)).startsWith('f') ? 'Feminino' : norm(g(cSexo)).startsWith('m') ? 'Masculino' : '';
    const obs = [!vazio(g(cArte)) ? `Experiência anterior: ${g(cArte)}` : '', !vazio(g(cComo)) ? `Conheceu a SAFE por: ${g(cComo)}` : ''].filter(Boolean).join('. ');
    const id = uid();

/* ============ Reconhecimento facial ============ */
const FACE_CDN = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15';
let faceProm = null;
function carregarFace(){
  if (faceProm) return faceProm;
  faceProm = new Promise((res, rej) => {
    if (window.faceapi) return res();
    const s = document.createElement('script'); s.src = FACE_CDN + '/dist/face-api.js';
    s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s);
  }).then(async () => {
    const tf = faceapi.tf;
    let ok = false;
    try { ok = await tf.setBackend('webgl'); } catch(e){ ok = false; }
    if (!ok) await tf.setBackend('cpu');
    await tf.ready();
    const M = FACE_CDN + '/model/';
    await faceapi.nets.ssdMobilenetv1.loadFromUri(M);
    await faceapi.nets.faceLandmark68Net.loadFromUri(M);
    await faceapi.nets.faceRecognitionNet.loadFromUri(M);
  }).catch(e => { faceProm = null; throw e; });
  return faceProm;
}
function lerImagem(fonte, max = 1280){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      if (typeof fonte !== 'string') URL.revokeObjectURL(img.src);
      res(c);
    };
    img.onerror = () => rej(new Error('imagem'));
    img.src = typeof fonte === 'string' ? fonte : URL.createObjectURL(fonte);
  });
}
const descParaLista = d => Array.from(d).map(x => Math.round(x * 10000) / 10000);
const avisoCarregando = t => abrirModal(`<h2>${t}</h2><p class="muted">Na primeira vez, o aparelho baixa o reconhecimento facial (cerca de 12 MB). Depois ele fica guardado e as próximas análises são bem mais rápidas.</p><p><strong>Aguarde...</strong></p>`);
const erroFace = () => { fecharModal(); toast('Não foi possível carregar o reconhecimento facial. Ele funciona na versão online do app, com internet.'); };
function formRosto(id){
  const a = S.alunos[id]; if (!a) return;
  const n = (a.rosto || []).length;
  abrirModal(`<h2>Reconhecimento facial</h2><p><strong>${esc(a.nome)}</strong></p>
    ${a.consBio ? `<p>${n ? `${n} foto${n > 1 ? 's' : ''} de referência cadastrada${n > 1 ? 's' : ''}.` : 'Nenhuma foto de referência ainda.'} O ideal são 2 ou 3 fotos: de frente, com boa luz, só o aluno na imagem. Fotos em ângulos diferentes melhoram o reconhecimento.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn primary">Tirar ou escolher foto<input type="file" accept="image/*" id="inRosto" hidden></label>
    ${a.foto ? `<button class="btn ghost" data-act="rosto-ficha" data-id="${id}">Usar a foto da ficha</button>` : ''}
    ${n ? `<button class="btn danger" data-act="rosto-apagar" data-id="${id}">Apagar dados faciais</button>` : ''}</div>
    <p class="muted small">O app guarda só uma "assinatura numérica" do rosto, não a foto. Ela é usada apenas para a chamada por foto.</p>`
    : `<div class="notice">Este aluno não autorizou o reconhecimento facial. Para usar, marque a autorização na ficha (com consentimento do aluno ou, se menor, do responsável).</div>`}
    <div class="actions"><button class="btn ghost" data-act="fechar">Fechar</button></div>`);
  const inp = $('#inRosto'); if (inp) inp.addEventListener('change', e => { const f = e.target.files[0]; if (f) cadastrarRosto(id, f); });
}
async function cadastrarRosto(id, fonte){
  avisoCarregando('Lendo o rosto');
  try { await carregarFace(); } catch(e){ return erroFace(); }
  try {
    const c = await lerImagem(fonte, 800);
    const r = await faceapi.detectSingleFace(c, new faceapi.SsdMobilenetv1Options({minConfidence:0.4})).withFaceLandmarks().withFaceDescriptor();
    if (!r){ fecharModal(); return toast('Nenhum rosto encontrado nessa foto. Tente uma foto de frente, com boa luz.'); }
    const a = S.alunos[id]; a.rosto = [...(a.rosto || []), descParaLista(r.descriptor)].slice(-5);
    salvar(); toast('Rosto cadastrado'); formRosto(id);
  } catch(e){ fecharModal(); toast('Não foi possível ler essa imagem.'); }
}
let _fr = null;
async function chamadaPorFoto(data, tid, arquivo){
  const base = alunosAtivos().filter(a => a.consBio && (a.rosto || []).length);
  if (!base.length) return toast('Nenhum aluno com rosto cadastrado ainda. Cadastre na ficha de cada aluno, em Reconhecimento facial.');
  avisoCarregando('Analisando a foto da turma');
  try { await carregarFace(); } catch(e){ return erroFace(); }
  let c, dets;
  try {
    c = await lerImagem(arquivo, 1600);
    dets = await faceapi.detectAllFaces(c, new faceapi.SsdMobilenetv1Options({minConfidence:0.35})).withFaceLandmarks().withFaceDescriptors();
  } catch(e){ fecharModal(); return toast('Não foi possível analisar essa imagem.'); }
  const matcher = new faceapi.FaceMatcher(base.map(a => new faceapi.LabeledFaceDescriptors(a.id, a.rosto.map(d => new Float32Array(d)))), 0.5);
  const melhor = {}; const desconhecidos = [];
  dets.forEach((d, i) => {
    const m = matcher.findBestMatch(d.descriptor);
    if (m.label === 'unknown'){ desconhecidos.push(i); return; }
    if (!melhor[m.label] || m.distance < melhor[m.label].dist){ if (melhor[m.label]) desconhecidos.push(melhor[m.label].i); melhor[m.label] = {i, dist:m.distance}; }
    else desconhecidos.push(i);
  });
  // desenha caixas e recorta rostos não reconhecidos
  const out = document.createElement('canvas'); out.width = c.width; out.height = c.height;
  const ctx = out.getContext('2d'); ctx.drawImage(c, 0, 0); ctx.lineWidth = Math.max(2, c.width / 400); const fs = Math.round(Math.max(14, c.width / 60)); ctx.font = `600 ${fs}px Barlow, sans-serif`;
  const recortes = {};
  dets.forEach((d, i) => {
    const b = d.detection.box, id = Object.keys(melhor).find(k => melhor[k].i === i);
    ctx.strokeStyle = id ? '#1E9E55' : '#E3344A'; ctx.strokeRect(b.x, b.y, b.width, b.height);
    const txt = id ? S.alunos[id].nome.split(' ')[0] : String(desconhecidos.indexOf(i) + 1);
    ctx.fillStyle = id ? '#1E9E55' : '#E3344A'; const tw = ctx.measureText(txt).width + 10, th = fs + 8;
    ctx.fillRect(b.x, Math.max(0, b.y - th), tw, th); ctx.fillStyle = '#fff'; ctx.fillText(txt, b.x + 5, Math.max(th - 6, b.y - 6));
    if (!id){ const r = document.createElement('canvas'), pad2 = b.width * 0.25; r.width = r.height = 72;
      r.getContext('2d').drawImage(c, Math.max(0, b.x - pad2), Math.max(0, b.y - pad2), b.width + pad2 * 2, b.height + pad2 * 2, 0, 0, 72, 72); recortes[i] = r.toDataURL('image/jpeg', 0.8); }
  });
  _fr = {data, tid, dets};
  const ids = Object.keys(melhor).sort((x, y) => S.alunos[x].nome.localeCompare(S.alunos[y].nome, 'pt-BR'));
  const opcoesAlunos = base.concat(alunosAtivos().filter(a => a.consBio && !(a.rosto || []).length)).filter(a => !melhor[a.id]).sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR'));
  abrirModal(`<h2>Chamada por foto</h2>
    <p class="muted small">${dets.length} rosto(s) encontrados, ${ids.length} reconhecido(s). Confira antes de confirmar: o reconhecimento pode errar com rosto de lado, de longe ou com pouca luz.</p>
    <img src="${out.toDataURL('image/jpeg', 0.85)}" alt="Foto da turma com os rostos marcados" style="width:100%;border-radius:8px;margin-bottom:12px">
    ${ids.length ? `<h3 style="margin-bottom:8px">Reconhecidos</h3><div class="checks" style="margin-bottom:14px">${ids.map(id => `<label class="check"><input type="checkbox" name="frOk" value="${id}" checked>${esc(S.alunos[id].nome)}</label>`).join('')}</div>` : ''}
    ${desconhecidos.length ? `<h3 style="margin-bottom:4px">Não reconhecidos</h3><p class="muted small" style="margin:0 0 8px">Se souber quem é, escolha o nome: o aluno recebe presença e o app aprende esse rosto para as próximas chamadas.</p>
      <div class="list" style="margin-bottom:14px">${desconhecidos.map((i, k) => `<div class="row" style="cursor:default"><img src="${recortes[i]}" alt="Rosto ${k + 1}" width="56" height="56" style="border-radius:8px"><span class="tag red">${k + 1}</span><select data-fr-rosto="${i}" aria-label="Quem é o rosto ${k + 1}" style="flex:1"><option value="">Não sei / ignorar</option>${opcoesAlunos.map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div>`).join('')}</div>` : ''}
    <div class="actions"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" data-act="fr-ok">Confirmar presença</button></div>`);
}
function confirmarFotoChamada(){
  if (!_fr) return;
  const {data, tid, dets} = _fr, key = `${data}_${tid}`;
  const p = S.presencas[key] ||= {data, turma:tid, alunos:{}};

/* ============ Financeiro ============ */
const fmtR = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtR0 = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const fmtRk = v => { v = Number(v) || 0; return Math.abs(v) >= 1000 ? `R$ ${(v / 1000).toLocaleString('pt-BR', {maximumFractionDigits:1})}k` : `R$ ${Math.round(v)}`; };
const mesAtual = () => hoje().slice(0, 7);
const addMes = (m, n) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const nomeMes = m => { const [y, mm] = m.split('-').map(Number); return `${MESES[mm-1]} de ${y}`; };
const mesCurto = m => MESES[Number(m.slice(5)) - 1].slice(0, 3);
const diasNoMes = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const FORMAS = ['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Transferência'];
const CAT_CUSTO = ['Manutenção','Limpeza','Material de treino','Marketing','Eventos e campeonatos','Estoque (compra de produtos)','Taxas e impostos','Outros'];
const CAT_RECEITA = ['Aula avulsa','Seminário','Exame de graduação','Evento','Outros'];
const planoDe = a => S.config.planos.find(p => p.id === a.plano);
function valorMensal(a){
  const p = planoDe(a); if (!p) return null;
  if (a.bolsa === 'integral' || a.bolsa === 'professor') return 0;
  let v = Number(p.valor) || 0;
  if (a.bolsa === 'parcial') v = v * (1 - (Number(a.bolsaPct) || 0) / 100);
  v -= Number(a.desconto) || 0;
  return Math.max(0, Math.round(v * 100) / 100);
}
function mensalidadesDoMes(m){
  if (m < (S.config.inicioFinanceiro || '0000-00')) return [];
  const regs = S.fin.mensalidades[m] || {}, ids = new Set(Object.keys(regs));
  Object.values(S.alunos).forEach(a => { if (cobravel(a, m)) ids.add(a.id); });
  return [...ids].filter(id => S.alunos[id]).map(id => {
    const a = S.alunos[id], r = regs[id] || null, plano = planoDe(a);
    const previsto = r && r.valor != null ? Number(r.valor) : (valorMensal(a) ?? 0);
    let venc = `${m}-${pad(Math.min(Number(a.vencimento) || 10, diasNoMes(m)))}`;
    if (a.dataMatricula && a.dataMatricula.slice(0, 7) === m && a.dataMatricula > venc) venc = a.dataMatricula;
    const st = r && r.pago ? 'pago' : previsto === 0 ? 'isento' : hoje() > venc ? 'atrasado' : 'aberto';
    return {a, r, plano, previsto, valor: st === 'pago' ? Number(r.valorPago ?? previsto) : previsto, venc, st};
  });
}
function resumoMes(m){
  const ms = mensalidadesDoMes(m);
  const mensPagas = ms.filter(x => x.st === 'pago').reduce((s, x) => s + x.valor, 0);
  const aReceber = ms.filter(x => x.st === 'aberto' || x.st === 'atrasado').reduce((s, x) => s + x.valor, 0);
  const atrasado = ms.filter(x => x.st === 'atrasado').reduce((s, x) => s + x.valor, 0);
  const previsto = ms.filter(x => x.st !== 'isento').reduce((s, x) => s + x.previsto, 0);
  const vendas = Object.values(S.fin.vendas).filter(v => (v.data || '').startsWith(m));
  const vendasPagas = vendas.filter(v => v.pago).reduce((s, v) => s + v.qtd * v.preco, 0);
  const lucroVendas = vendas.filter(v => v.pago).reduce((s, v) => s + v.qtd * (v.preco - (Number(v.custo) || 0)), 0);
  const lanc = Object.values(S.fin.lancamentos).filter(l => (l.data || '').startsWith(m));
  const outras = lanc.filter(l => l.tipo === 'receita').reduce((s, l) => s + Number(l.valor || 0), 0);
  const variaveis = lanc.filter(l => l.tipo === 'custo');
  const cond = mensPagas * (Number(S.config.custos.condominioPct) || 0) / 100;
  const fixos = S.config.custos.fixos.map(f => ({nome:f.nome, valor:Number(f.valor) || 0}));
  const custos = cond + fixos.reduce((s, f) => s + f.valor, 0) + variaveis.reduce((s, l) => s + Number(l.valor || 0), 0);
  const receita = mensPagas + vendasPagas + outras;
  const pagantes = ms.filter(x => x.st === 'pago' && x.valor > 0).length;
  return {ms, mensPagas, aReceber, atrasado, previsto, vendasPagas, lucroVendas, outras, variaveis, cond, fixos, custos, receita, liquido:receita - custos, pagantes, ticket:pagantes ? mensPagas / pagantes : 0};
}
function primeiroMesComDados(){

}

function statusEm(a, d){
  if (a.dataMatricula && d < a.dataMatricula) return null;
  const h = (a.historicoStatus || []).slice().sort((x, y) => x.data.localeCompare(y.data));
  let st = h.length ? (h[0].anterior || 'ativo') : a.status;
  h.forEach(x => { if (x.data <= d) st = x.status; });
  return st;
}
function cobravel(a, m){
  if (!a.plano) return false;
  const mm = (a.dataMatricula || '').slice(0, 7);
  if (mm && mm > m) return false;
  const vencDia = `${m}-${pad(Math.min(Number(a.vencimento) || 10, diasNoMes(m)))}`, h = hoje();
  const ref = vencDia < h ? vencDia : h;
  if (mm === m) return statusEm(a, ref) === 'ativo' || statusEm(a, h < `${m}-${pad(diasNoMes(m))}` ? h : `${m}-${pad(diasNoMes(m))}`) === 'ativo';
  return statusEm(a, ref) === 'ativo';
}
function debitosEmAberto(){
  const ini = S.config.inicioFinanceiro || mesAtual(), fim = mesAtual(), por = {};

function cpfValido(c){
  c = String(c || '').replace(/\D/g, ''); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += Number(c[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === Number(c[9]) && dv(10) === Number(c[10]);
}

function cresExp(){
  const m = ui.cresMes, h = hoje(), todas = Object.values(S.cres.exp);
  const doMes = todas.filter(x => (x.data || '').startsWith(m));
  const vieram = doMes.filter(x => ['compareceu','matriculou','nao_fechou'].includes(x.status));
  const matric = doMes.filter(x => x.status === 'matriculou');
  const proximas = todas.filter(x => x.status === 'agendada' && x.data >= h).sort((a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')));
  const retorno = todas.filter(x => x.status === 'compareceu').sort((a, b) => a.data.localeCompare(b.data));
  const atrasadas = todas.filter(x => x.status === 'agendada' && x.data < h);
  const porCanal = {};
  doMes.forEach(x => { const c = x.canal || 'Não informado'; const o = porCanal[c] ||= {n:0, v:0, m:0}; o.n++; if (vieram.includes(x)) o.v++; if (x.status === 'matriculou') o.m++; });

/* ---- Retenção ---- */
function cresRet(){
  const h = hoje(), alunos = Object.values(S.alunos);
  const ativos = alunos.filter(a => a.status === 'ativo');
  // mês a mês
  const meses = []; for (let i = 5; i >= 0; i--) meses.push(addMes(mesAtual(), -i));
  const linhas = meses.map(m => {
    const ini = `${m}-01`, fim = m === mesAtual() ? h : `${m}-${pad(diasNoMes(m))}`;
    const base = alunos.filter(a => statusEm(a, ini) === 'ativo').length;
    const entradas = alunos.filter(a => { const p = primeiraAtivacao(a); return p && p >= ini && p <= fim; }).length;
    const saidas = saidasNoPeriodo(ini, fim).length;
    return {m, base, entradas, saidas};
  });
  // coortes
  const coortes = [];
  for (let i = 11; i >= 0; i--){
    const m = addMes(mesAtual(), -i);
    const membros = alunos.filter(a => { const p = primeiraAtivacao(a); return p && p.slice(0, 7) === m; });
    if (!membros.length) continue;
    const ret = n => { const alvo = addMesesData(`${m}-15`, n); if (alvo > h) return '—'; const c = membros.filter(a => statusEm(a, addMesesData(primeiraAtivacao(a), n)) === 'ativo').length; return pct(c, membros.length); };
    coortes.push({m, n:membros.length, r1:ret(1), r3:ret(3), r6:ret(6), r12:ret(12)});
  }
  // permanência
  const saiu = alunos.filter(a => a.status !== 'ativo' && a.status !== 'novo' && primeiraAtivacao(a) && ultimaSaida(a));
  const permS = saiu.map(a => mesesEntre(primeiraAtivacao(a), ultimaSaida(a).data));
  const permA = ativos.filter(a => primeiraAtivacao(a)).map(a => mesesEntre(primeiraAtivacao(a), h));
  const media = v => v.length ? v.reduce((s, x) => s + x, 0) / v.length : 0;
  const pagantes = ativos.map(valorMensal).filter(v => v > 0), ticket = media(pagantes);
  const permBase = permS.length >= 3 ? media(permS) : null;
  // motivos
  const mot = {}; saidasNoPeriodo(addMesesData(h, -12), h).forEach(x => { const k = x.motivo || 'Não informado'; mot[k] = (mot[k] || 0) + 1; });
  // radar 90 dias
  const radar = ativos.map(a => { const p = primeiraAtivacao(a); if (!p || diasEntre(p, h) > 90) return null;
    const dias = Math.max(1, diasEntre(p, h)), tr = presEntre(a.id, p, h), sem = Math.max(1, dias / 7), freq = tr / sem, sum = diasSumido(a);
    return {a, dias, tr, freq, sum, risco: freq < 1.5 || (sum ?? 0) >= 7}; }).filter(Boolean).sort((x, y) => (y.risco - x.risco) || (x.freq - y.freq));
  // ocupação
  const ini56 = addDias(h, -56);
  const ocup = S.config.turmas.map(t => { const ses = Object.values(S.presencas).filter(p => p.turma === t.id && p.data >= ini56 && Object.keys(p.alunos || {}).length);
    const tot = ses.reduce((s, p) => s + Object.keys(p.alunos).length, 0); return {t, n:ses.length, med: ses.length ? tot / ses.length : 0}; })
    .sort((a, b) => a.t.dia - b.t.dia || a.t.hora.localeCompare(b.t.hora));
  const maxO = Math.max(1, ...ocup.map(o => o.med));
  return `<div class="numeros" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    ${cardN(ativos.length, 'alunos ativos')}${cardN(permA.length ? tempoTexto(Math.round(media(permA))) : '—', 'tempo médio de casa dos ativos')}${cardN(permBase != null ? tempoTexto(Math.round(permBase)) : '—', 'permanência média de quem saiu')}
    ${isAdmin() ? cardN(permBase != null && ticket ? fmtR0(ticket * permBase) : '—', 'valor médio de um aluno na vida (ticket × permanência)') : ''}</div>
  <div class="panel"><h3 style="margin-bottom:8px">Entradas e saídas</h3><div class="tbl-wrap"><table><thead><tr><th>Mês</th><th>Ativos no início</th><th>Entraram</th><th>Saíram</th><th>Cancelamento</th></tr></thead><tbody>
    ${linhas.map(l => `<tr><td>${mesCurto(l.m)}/${l.m.slice(2, 4)}</td><td>${l.base}</td><td style="color:var(--ok)">+${l.entradas}</td><td style="color:var(--red)">−${l.saidas}</td><td><strong>${pct(l.saidas, l.base)}</strong></td></tr>`).join('')}</tbody></table></div>
    <p class="muted small">Cancelamento = saídas do mês ÷ ativos no início do mês. Saídas contam a partir da data informada ao mudar a situação do aluno.</p></div>
  <div class="panel"><h3 style="margin-bottom:8px">Quantos continuam, por mês de entrada</h3><div class="tbl-wrap"><table><thead><tr><th>Entrada</th><th>Alunos</th><th>1 mês</th><th>3 meses</th><th>6 meses</th><th>12 meses</th></tr></thead><tbody>
    ${coortes.map(c => `<tr><td>${mesCurto(c.m)}/${c.m.slice(2, 4)}</td><td>${c.n}</td><td>${c.r1}</td><td>${c.r3}</td><td>${c.r6}</td><td>${c.r12}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Sem entradas nos últimos 12 meses.</td></tr>'}</tbody></table></div>
    <p class="muted small">Mostra a porcentagem de cada turma de entrada que ainda estava ativa depois de 1, 3, 6 e 12 meses. É o número mais honesto de retenção, porque não mistura alunos novos com antigos.</p></div>
  <div class="panel"><h3 style="margin-bottom:6px">Radar dos primeiros 90 dias</h3><p class="muted small">Novatos são o grupo que mais desiste. Em vermelho: menos de 1,5 treino por semana ou 7 dias sem aparecer.</p>
    <div class="list">${radar.length ? radar.map(r => { const tel = r.a.telefone || r.a.telResp; const msg = `Oi, ${r.a.nome.split(' ')[0]}! Tudo certo? Estamos acompanhando seus primeiros treinos na SAFE e queremos saber como está sendo. Algum horário fica difícil? Te esperamos no tatame! Oss!`;
      return `<div class="row" style="cursor:default"><a class="grow" href="#/aluno/${r.a.id}" style="text-decoration:none"><span class="name" style="display:block">${esc(r.a.nome)}</span><span class="meta">${r.risco ? '<span class="tag red">Atenção</span>' : '<span class="tag ok">Bem</span>'} ${r.dias} dias de casa, ${r.tr} treinos, ${r.freq.toFixed(1)} por semana${r.sum != null ? `, último há ${r.sum} dia(s)` : ''}</span></a>${tel ? `<a class="btn small ghost" href="${waLink(tel, msg)}" target="_blank" rel="noopener">Falar</a>` : ''}</div>`; }).join('') : '<div class="empty">Nenhum aluno com menos de 90 dias de casa.</div>'}</div></div>
  <div class="grid2" style="gap:0 16px;align-items:start">
    <div class="panel"><h3 style="margin-bottom:10px">Por que saíram (12 meses)</h3>${barrasH(Object.entries(mot).map(([nome, valor]) => ({nome, valor})).sort((a, b) => b.valor - a.valor), v => `${v}`)}<p class="muted small">O motivo passa a ser pedido sempre que um aluno é marcado como inativo ou trancado.</p></div>
    <div class="panel"><h3 style="margin-bottom:10px">Ocupação por horário (8 semanas)</h3>${ocup.map(o => { const md = mod(o.t.mod) || {nome:'?', cor:'#999'}; return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:15px"><span><i class="dot" style="background:${md.cor}"></i> ${DIAS_C[o.t.dia]} ${o.t.hora} ${esc(md.nome)}</span><strong>${o.med.toFixed(1)}</strong></div><div class="bar"><i style="width:${Math.round(o.med / maxO * 100)}%;background:${md.cor}"></i></div><span class="muted small">${o.n} aula(s) registrada(s)</span></div>`; }).join('')}</div>
  </div>`;
}

/* ---- Origem e indicações ---- */
function cresOrigem(){

  const porCanal = {};
  alunos.forEach(a => { const c = a.canal || 'Não informado'; const o = porCanal[c] ||= {n:0, at:0, perm:[]}; o.n++; if (a.status === 'ativo') o.at++; const fim = a.status === 'ativo' ? hoje() : (ultimaSaida(a) || {}).data; if (fim) o.perm.push(mesesEntre(primeiraAtivacao(a), fim)); });
  const exps = Object.values(S.cres.exp);
  const ind = {};
  Object.values(S.alunos).forEach(a => { if (!a.indicadoPor || !primeiraAtivacao(a)) return; const k = norm(a.indicadoPor); const o = ind[k] ||= {nome:a.indicadoPor, n:0, at:0, lista:[]}; o.n++; if (a.status === 'ativo') o.at++; o.lista.push(a.nome); });

/* ---- Pautas para o Instagram ---- */
function cresPautas(){
  const h = hoje(), ini = addDias(h, -14), ps = [];
  const ok = a => a && a.consImagem && a.status !== 'inativo';
  const pn = a => a.nome.split(' ')[0];
  Object.values(S.alunos).forEach(a => {
    if (!ok(a)) return;
    (a.historico || []).forEach(x => { if (x.data >= ini && x.data <= h && !/cadastro|exemplo/i.test(x.obs || '')) ps.push({data:x.data, tipo:'Graduação', a, txt: x.tipo === 'grau' ? `Mais um grau na faixa! Parabéns, ${pn(a)}, pelo ${x.graus}º grau na faixa ${faixa(x.faixa).nome.toLowerCase()}. Constância que vira evolução no tatame da SAFE. Oss!` : `Nova faixa na SAFE! Parabéns, ${pn(a)}, pela faixa ${faixa(x.faixa).nome.toLowerCase()}. Cada treino contou para chegar aqui. Oss!`}); });
    const p = primeiraAtivacao(a); if (p && p >= ini && p <= h) ps.push({data:p, tipo:'Boas-vindas', a, txt:`Seja bem-vindo(a) à família SAFE, ${pn(a)}! O primeiro passo no tatame é o mais importante. Oss!`});
    const antes = presEntre(a.id, '0000', addDias(ini, -1)), agora = presDe(a.id).length;
    [50, 100, 150, 200, 300, 500, 1000].forEach(mc => { if (antes < mc && agora >= mc) ps.push({data:h, tipo:'Marco de treinos', a, txt:`${mc} treinos! ${pn(a)} completou ${mc} treinos na SAFE. Disciplina é isso: aparecer, treino após treino. Oss!`}); });
    if (a.nascimento){ const prox = `${h.slice(0, 4)}-${a.nascimento.slice(5)}`; const d = diasEntre(h, prox); if (d >= 0 && d <= 7) ps.push({data:prox, tipo: d === 0 ? 'Aniversário hoje' : `Aniversário em ${d} dia(s)`, a, txt:`Hoje é dia de festa no tatame! Feliz aniversário, ${pn(a)}! A família SAFE deseja muita saúde e muitos treinos. Oss!`}); }
  });
  Object.values(S.campeonatos).forEach(c => { if (!c.data || c.data < ini || c.data > h) return; (c.inscritos || []).forEach(i => { const a = S.alunos[i.aluno]; if (!ok(a) || !['ouro','prata','bronze'].includes(i.resultado)) return;
    ps.push({data:c.data, tipo:'Medalha', a, txt:`${i.resultado === 'ouro' ? 'Ouro' : i.resultado === 'prata' ? 'Prata' : 'Bronze'} para a SAFE! ${pn(a)} subiu ao pódio no ${c.nome}${i.categoria ? `, categoria ${i.categoria}` : ''}. Orgulho da equipe! Oss!`}); }); });

function iniciarFirebase(){
