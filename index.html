// Grava campo a campo: duas pessoas editando o mesmo registro não apagam o trabalho uma da outra
function achatar(m, caminho, v, prof){
  if (v === undefined || v === null) return;
  if (prof <= 0 || typeof v !== 'object' || Array.isArray(v)){ m[caminho] = JSON.stringify(v); return; }
  Object.keys(v).forEach(k => achatar(m, caminho + '/' + k, v[k], prof - 1));
}
function mapear(){
  const m = {};
  const {planos, custos, pix, msgCobranca, inicioFinanceiro, ...cfg} = S.config;
  achatar(m, 'config', cfg, 1);
  if (isAdmin()){
    achatar(m, 'configFin', {planos, custos, pix, msgCobranca, inicioFinanceiro}, 1);
    Object.entries(S.fin.mensalidades).forEach(([mes, regs]) => Object.entries(regs || {}).forEach(([id, r]) => achatar(m, `financeiro/mensalidades/${mes}/${id}`, r, 1)));

    Object.entries(S.fin.produtos).forEach(([id, v]) => achatar(m, `financeiro/produtos/${id}`, v, 2));
    Object.entries(S.lixeira || {}).forEach(([id, v]) => achatar(m, `lixeira/${id}`, v, 0));
  }
  Object.entries(S.log || {}).forEach(([id, v]) => achatar(m, `historico/${id}`, v, 0));
  Object.values(S.alunos).forEach(a => {
    const f = {}, b = {};

    achatar(m, 'alunos/' + a.id, b, 1); if (isAdmin()) achatar(m, 'alunosFin/' + a.id, f, 1);
  });
  Object.entries(S.presencas).forEach(([k, p]) => achatar(m, 'presencas/' + k, p, 2));
  Object.values(S.campeonatos).forEach(c => achatar(m, 'campeonatos/' + c.id, c, 1));
  Object.entries(S.cres.exp).forEach(([id, v]) => achatar(m, 'crescimento/experimentais/' + id, v, 1));

function salvarOnline(){

}

/* ============ Modal ============ */
function abrirModal(html){
  $('#modal-root').innerHTML = `<div class="modal-bg" data-act="fundo"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  const first = $('#modal-root').querySelector('input:not([type=hidden]):not([type=file]),select,textarea'); if (first) first.focus();
}
function confirmar(msg, ok = 'Confirmar'){
  return new Promise(res => {
    abrirModal(`<h2>Confirme</h2><p>${esc(msg)}</p><div class="actions"><button class="btn ghost" id="cfNo">Cancelar</button><button class="btn primary" id="cfOk">${esc(ok)}</button></div>`);
    $('#cfNo').onclick = () => { fecharModal(); res(false); };
    $('#cfOk').onclick = () => { fecharModal(); res(true); };
    $('#cfOk').focus();
  });
}
function fecharModal(){ $('#modal-root').innerHTML = ''; document.body.style.overflow = ''; if (pendRender) setTimeout(agendarRender, 0); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) fecharModal(); });

    'esqueci': () => {
      const email = ($('#lEmail') || {}).value;
      if (!email) return toast('Digite seu e-mail no campo acima e toque de novo em "Esqueci minha senha".');
      auth.languageCode = 'pt'; auth.sendPasswordResetEmail(email).then(() => toast('Enviamos um e-mail para você criar uma nova senha.')).catch(e => toast(msgAuth(e)));
    },
    'ver-novos': () => { ui.fStatus = 'novo'; render(); },
    'imp-forms': () => {
      abrirModal(`<h2>Importar do Google Forms</h2>
        <p class="small">Enquanto o app está em modo teste, a importação é feita copiando e colando. Na versão online ela será automática.</p>
        <ol class="small" style="padding-left:20px">
          <li>No computador, abra a planilha de respostas: <a href="${esc(S.config.formsPlanilha)}" target="_blank" rel="noopener">Ficha de Cadastro (Respostas)</a>.</li>
          <li>Clique em qualquer célula e aperte <strong>Ctrl + A</strong> (no Mac, Cmd + A) para selecionar tudo.</li>
          <li>Aperte <strong>Ctrl + C</strong> para copiar.</li>
          <li>Clique na caixa abaixo e aperte <strong>Ctrl + V</strong> para colar.</li>
          <li>Toque em <strong>Importar</strong>.</li>
        </ol>
        <textarea id="txtForms" style="min-height:160px" placeholder="Cole aqui a planilha inteira, com a linha de títulos"></textarea>
        <p class="muted small">Quem já estiver cadastrado (mesmo nome e nascimento) é ignorado, então pode colar a planilha inteira sempre que quiser. Os novos entram como "Novo cadastro" para você revisar.</p>
        <div class="actions"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" data-act="imp-forms-ok">Importar</button></div>`);
    },
    'imp-forms-ok': () => {
      const r = importarForms($('#txtForms').value);
      if (r.erro) return toast(r.erro);
      fecharModal(); ui.fStatus = r.novos ? 'novo' : ui.fStatus; render();
      toast(`${r.novos} novo${r.novos === 1 ? '' : 's'} cadastro${r.novos === 1 ? '' : 's'} importado${r.novos === 1 ? '' : 's'}${r.dup ? `, ${r.dup} já existia${r.dup === 1 ? '' : 'm'}` : ''}`);
    },
    'gradTab': () => { ui.gradTab = el.dataset.v; render(); },
    'maisTab': () => { ui.maisTab = el.dataset.v; render(); },
    'grad-aptos': () => { ui.gradTab = 'alunos'; ui.gradFiltro = 'aptos'; },
    'ver-sumidos': () => { ui.presTab = 'sumidos'; },
    'add-turma': () => { S.config.turmas.push({id:uid(), mod:S.config.modalidades[0]?.id, dia:1, hora:'19:00'}); salvar(); render(); },
    'del-turma': () => { S.config.turmas = S.config.turmas.filter(t => t.id !== id); salvar(); render(); },
    'add-mod': () => { S.config.modalidades.push({id:uid(), nome:'Nova modalidade', cor:'#607080'}); salvar(); render(); },
    'del-mod': async () => {
      const uso = Object.values(S.alunos).filter(a => (a.mods || []).includes(id)).length;
      if (!(await confirmar(uso ? `${uso} aluno(s) estão nesta modalidade. Remover mesmo assim? Os horários dela também saem da grade.` : 'Remover esta modalidade e seus horários?'))) return;
      registrar(`Removeu a modalidade ${mod(id)?.nome || ''}`);
      S.config.modalidades = S.config.modalidades.filter(m => m.id !== id);
      S.config.turmas = S.config.turmas.filter(t => t.mod !== id); salvar(); render();
    },
    'add-plano': () => { S.config.planos.push({id:uid(), nome:'Novo plano', valor:0, meses:1, mods:[]}); salvar(); render(); },
    'del-plano': async () => { if (await confirmar('Remover este plano?')){ registrar(`Removeu o plano ${S.config.planos[Number(el.dataset.i)]?.nome || ''}`); S.config.planos.splice(Number(el.dataset.i), 1); salvar(); render(); } },
    'add-custo': () => { S.config.custos.fixos.push({id:uid(), nome:'Novo custo', valor:0}); salvar(); render(); },
    'del-custo': () => { S.config.custos.fixos.splice(Number(el.dataset.i), 1); salvar(); render(); },
    'reset-faixas': async () => { if (await confirmar('Voltar faixas para o padrão IBJJF?')){ registrar('Restaurou faixas ao padrão IBJJF'); S.config.faixas = faixasPadrao(); salvar(); render(); } },
    'exemplo': () => { carregarExemplo(); toast('Exemplos carregados'); location.hash = '#/inicio'; render(); },
    'limpar': async () => { if (await confirmar('Apagar TODOS os alunos, presenças e ajustes deste navegador? Essa ação não pode ser desfeita.')){ registrar('Apagou todos os alunos, presenças e campeonatos'); if (ONLINE){ S.alunos = {}; S.presencas = {}; S.campeonatos = {}; salvar(); } else { localStorage.removeItem(KEY); carregar(); salvar(); } render(); toast('Dados apagados'); } },
    'copiar-backup': () => {
      const txt = JSON.stringify(dadosBackup());
      const ok = () => toast('Backup copiado. Cole num e-mail ou nota para guardar.');
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok).catch(() => mostrarBackup(txt)); else mostrarBackup(txt);
    },
    'importar': () => {
      abrirModal(`<h2>Restaurar backup</h2><p class="muted small">Cole o texto do backup. Isso substitui os dados atuais deste navegador.</p><textarea id="txtImp" style="min-height:200px"></textarea><div class="actions"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" data-act="importar-ok">Restaurar</button></div>`);
    },
    'importar-ok': () => {
      try { const o = JSON.parse($('#txtImp').value); if (!o.config || !o.alunos) throw 0; const meta = S.meta, logAnt = S.log, lixAnt = S.lixeira; S = {config:o.config, alunos:o.alunos, presencas:o.presencas || {}, campeonatos:o.campeonatos || {}, fin:o.fin || {}, cres:o.cres || {}, log:logAnt, lixeira:lixAnt, meta: ONLINE ? meta : (o.meta || meta)}; normalizar(); registrar('Restaurou um backup'); salvar(); fecharModal(); render(); toast('Backup restaurado'); }
      catch(err){ toast('Texto de backup inválido. Copie o backup completo e tente de novo.'); }
    }
  };
  const LOG_ACOES = {'add-turma':'Adicionou horário na grade','del-turma':'Removeu horário da grade','add-mod':'Adicionou modalidade','add-plano':'Adicionou plano','add-custo':'Adicionou custo fixo','del-custo':'Removeu custo fixo','comp-add':'Alterou regras de competição','comp-del':'Alterou regras de competição','add-golpe':'Alterou tabela de golpes','add-atleta-ok':'Adicionou atleta à equipe'};
  if (A[act]){ if (LOG_ACOES[act]) registrar(LOG_ACOES[act] + (act === 'add-atleta-ok' ? `: ${S.alunos[id]?.nome || ''}` : '')); A[act](); }
});
function mostrarBackup(txt){
  abrirModal(`<h2>Backup</h2><p class="muted small">Selecione todo o texto abaixo e copie.</p><textarea style="min-height:220px" readonly>${esc(txt)}</textarea><div class="actions"><button class="btn primary" data-act="fechar">Fechar</button></div>`);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'busca'){ ui.busca = t.value; listaAlunos(); }
  if (['simSexo','simAno','simPeso'].includes(t.id)){ ui.sim = {sexo:$('#simSexo').value, ano:$('#simAno').value, peso:$('#simPeso').value}; simAtualiza(); }
  if (t.id === 'chamadaBusca'){ ui.chamadaBusca = t.value; const [, d, tid] = rota(); listaChamada(d, tid); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fMod'){ ui.fMod = t.value; listaAlunos(); }
  else if (t.id === 'fStatus'){ ui.fStatus = t.value; listaAlunos(); }
  else if (t.id === 'presData'){ ui.presData = t.value || hoje(); renderDepois(); }
  else if (t.id === 'rankPer'){ ui.rankPer = t.value; renderDepois(); }
  else if (t.id === 'rankMod'){ ui.rankMod = t.value; renderDepois(); }
  else if (t.id === 'gradFiltro'){ ui.gradFiltro = t.value; renderDepois(); }
  else if (t.id === 'cresMes'){ ui.cresMes = t.value || hoje().slice(0, 7); renderDepois(); }
  else if (t.id === 'profMes'){ ui.profMes = t.value || hoje().slice(0, 7); renderDepois(); }
  else if (t.id === 'profAula'){ const [, d, tid] = rota(); const v = t.value.trim(); S.meta.ultimoProf = v || S.meta.ultimoProf; const k = `${d}_${tid}`; if (S.presencas[k]){ if (v) S.presencas[k].prof = v; else delete S.presencas[k].prof; } if (!ONLINE) salvar(); else salvar(); }
  else if (t.id === 'fotoTurma'){ const f = t.files[0]; t.value = ''; const [, d, tid] = rota(); if (f) chamadaPorFoto(d, tid, f); }
  else if (t.id === 'finMes'){ ui.finMes = t.value || hoje().slice(0, 7); renderDepois(); }
  else if (t.id === 'finFiltro'){ ui.finFiltro = t.value; renderDepois(); }
  else if (t.id === 'finMod'){ ui.finMod = t.value; renderDepois(); }
  else if (t.id === 'finSt'){ ui.finSt = t.value; renderDepois(); }
  else if (['gIdade','gFaixa','gFormato','gDiv'].includes(t.id)){ ui.golpe = {idade:$('#gIdade').value, faixa:$('#gFaixa').value, formato:$('#gFormato').value, divisao:$('#gDiv') ? $('#gDiv').value : 'adulto'}; renderDepois(); }
  else if (t.dataset.golpe !== undefined){ comp().golpes[Number(t.dataset.golpe)].proib[Number(t.dataset.col)] = t.checked; salvar(); }
  else if (t.dataset.act === 'papel'){ S.meta.papel = t.value; salvar(); renderDepois(); }
  else if (t.dataset.act === 'tema'){ S.meta.tema = t.value; aplicarTema(); if (ONLINE) localStorage.setItem('safe_tema', t.value); else salvar(); }
  else if (t.dataset.bind){
    let v = t.value;
    if (t.hasAttribute('data-num')) v = v === '' ? null : Number(v);
    setPath(S.config, t.dataset.bind, v);
    const NOMES_AJ = {modalidades:'modalidades', planos:'planos', custos:'custos fixos', faixas:'requisitos de faixa', competicao:'regras de competição', pix:'chave Pix', msgCobranca:'mensagem de cobrança', inicioFinanceiro:'início do controle financeiro'};
    registrar(`Alterou ajustes: ${NOMES_AJ[t.dataset.bind.split('.')[0]] || t.dataset.bind.split('.')[0]}`); salvar();
    if (t.dataset.bind.startsWith('modalidades') || t.dataset.bind.startsWith('faixas')) renderDepois();
  }
  else if (t.dataset.bindTurma){
    const tu = turma(t.dataset.bindTurma); tu[t.dataset.campo] = t.dataset.campo === 'dia' ? Number(t.value) : t.value; registrar('Alterou a grade de horários'); salvar(); renderDepois();
  }
  else if (t.dataset.modFaixa !== undefined){ S.config.modalidades[Number(t.dataset.modFaixa)].faixa = t.checked; registrar('Alterou ajustes: modalidades'); salvar(); }
  else if (t.id === 'logBusca'){ ui.logBusca = t.value; ui.logN = 100; renderDepois(); }
  else if (t.hasAttribute('data-facial')){ S.config.facial = t.checked; salvar(); }
  else if (t.hasAttribute('data-exigir-graus')){ S.config.exigirGraus = t.checked; salvar(); }
  else if (t.dataset.planoMod !== undefined){
    const p = S.config.planos[Number(t.dataset.planoMod)];
    p.mods = t.checked ? [...new Set([...p.mods, t.value])] : p.mods.filter(m => m !== t.value); salvar();
  }
});
function aplicarTema(){
  const v = S.meta.tema || 'auto';
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
}

/* ============ Início ============ */
carregar(); aplicarTema(); render();
if (ONLINE) iniciarFirebase();
</script>
</body>
</html>
